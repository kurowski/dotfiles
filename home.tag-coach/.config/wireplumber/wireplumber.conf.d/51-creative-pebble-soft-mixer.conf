# Creative Pebble X Plus (USB 041e:329a): do volume in software.
#
# The speakers' own mixer only spans -28.4 dB .. 0 dB, and the firmware mutes
# the amp once that mixer drops below roughly -25.5 dB — 37% on the desktop
# slider, with PipeWire's cubic curve. So the bottom third of the slider was
# silent and the step above it wasn't quiet. PipeWire's own handling was fine
# (it only starts attenuating in software once the hardware hits its floor at
# 33%); the cutoff is in the device.
#
# soft-mixer takes the mixer away from PipeWire entirely: volume and mute are
# applied to the stream, and the hardware level is left where it is. That
# level has to be max for the slider to mean anything, which is
# scripts.tag-coach/25-pebble-hw-volume.sh's job; the alsactl state daemon
# then keeps it there across boots and replugs.
#
# The knob on the speakers is a USB HID consumer control (volume keys to the
# desktop), not a hardware gain, so it keeps working and drives this same
# software volume.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Creative_Technology_Ltd_Creative_Pebble_X_Plus.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Creative_Technology_Ltd_Creative_Pebble_X_Plus.*" }
    ]
    actions = {
      update-props = {
        # The device is 16-bit, and software attenuation now happens before
        # the float -> S16 conversion. Dither so quiet material doesn't pick
        # up quantisation grit.
        dither.method = "wannamaker3"
      }
    }
  }
]
