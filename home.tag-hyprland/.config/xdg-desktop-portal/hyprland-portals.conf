# Portal backend routing for the Hyprland session.
#
# This file is the reason following the desktop keeps working outside Plasma, and
# it is the single most load-bearing line in the hyprland tag.
#
# `theme-mode` resolves light/dark by asking the portal for
# org.freedesktop.appearance color-scheme. Something has to implement
# org.freedesktop.impl.portal.Settings to answer that. Checking what's on disk:
#
#   /usr/share/xdg-desktop-portal/portals/kde.portal      → …impl.portal.Settings ✓
#   /usr/share/xdg-desktop-portal/portals/gtk.portal      → …impl.portal.Settings ✓
#   xdg-desktop-portal-hyprland                           → ScreenCast, Screenshot,
#                                                            GlobalShortcuts — no Settings
#
# In a Plasma session kde.portal answers, out of kdeglobals. In a Hyprland
# session it must be gtk.portal, which answers out of gsettings
# `org.gnome.desktop.interface color-scheme` — and that is what makes gsettings
# the light/dark authority here, and what `theme-toggle` writes.
#
# The packaged /usr/share/xdg-desktop-portal/hyprland-portals.conf sets only
# `default=hyprland;gtk`, which would *probably* fall through to gtk for
# Settings on its own, since a backend that doesn't declare an interface is
# skipped. This states it outright instead, for two reasons: the fallback also
# depends on gtk.portal's `UseIn=gnome` hint being overridden by an explicit
# preference, and if a future xdg-desktop-portal-hyprland does add a Settings
# implementation, the implicit version would silently start answering from
# somewhere that has never heard of gsettings — and auto-theming would break
# with no error anywhere.

[preferred]
# Hyprland first for everything it does implement — ScreenCast and
# GlobalShortcuts genuinely need the compositor's own backend, and routing
# those to gtk breaks screen sharing.
default=hyprland;gtk

# The one interface pinned by name. See above.
org.freedesktop.impl.portal.Settings=gtk
