# Point swaync at the generated, flavour-aware stylesheet, and scope it to the
# Hyprland session.
#
# Scoping matters more here than for waybar: Plasma runs its own notification
# server, and swaync claiming org.freedesktop.Notifications inside a Plasma
# session would take over notifications there too. Binding to
# wayland-session@hyprland.desktop.target keeps it out.
#
# The empty ExecStart= clears the packaged one before setting ours; without it
# systemd appends and the unit tries to start two daemons on the same bus name.
[Service]
ExecStart=
ExecStart=/usr/bin/swaync -s %h/.local/state/theme-mode/swaync.css

[Unit]
# Order after uwsm confirms the compositor's variables are exported. waybar has
# no ConditionEnvironment so it survives without this, but swaync does — and
# relying on D-Bus activation to paper over a missed start is luck, not design.
# See hyprpaper.service.d/session.conf for the full story.
After=wayland-session-waitenv.service
PartOf=wayland-session@hyprland.desktop.target
After=wayland-session@hyprland.desktop.target
