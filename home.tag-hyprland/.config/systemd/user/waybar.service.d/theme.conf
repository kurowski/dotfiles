# Point waybar at the generated, flavour-aware stylesheet.
#
# ~/.local/state/theme-mode/waybar.css is flavor-<mode>.css concatenated in
# front of style.css, written by ~/.local/bin/theme-mode. Concatenation rather
# than a GTK @import because ~/.config/waybar/style.css is a symlink into the
# dotfiles repo, and GTK resolves relative imports against the symlink's target
# — so an import pointing at ~/.local/state would be looked up inside the repo
# and silently not found.
#
# The empty ExecStart= is required: systemd appends to ExecStart for Type=simple
# units unless the list is cleared first, and appending would start two bars.
[Service]
ExecStart=
ExecStart=/usr/bin/waybar -s %h/.local/state/theme-mode/waybar.css

# Bind to the Hyprland session specifically rather than to graphical-session,
# so logging into Plasma doesn't start a second bar on top of its panel.
# 26-hyprland-session.sh is what adds the corresponding Wants.
[Unit]
# Order after uwsm confirms the compositor's variables are exported. waybar has
# no ConditionEnvironment so it survives without this, but swaync does — and
# relying on D-Bus activation to paper over a missed start is luck, not design.
# See hyprpaper.service.d/session.conf for the full story.
After=wayland-session-waitenv.service
PartOf=wayland-session@hyprland.desktop.target
After=wayland-session@hyprland.desktop.target
