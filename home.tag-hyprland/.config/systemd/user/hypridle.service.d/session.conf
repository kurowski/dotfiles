# Order this daemon after uwsm has confirmed the compositor's variables are in
# the systemd activation environment, and scope it to the Hyprland session.
#
# Without the After= below, this unit does not start at boot — silently.
#
# The packaged unit carries ConditionEnvironment=WAYLAND_DISPLAY. uwsm's
# wayland-session@<entry>.target Wants both this daemon and
# wayland-session-waitenv.service, but Wants= implies no ordering, so the two
# race. And the compositor's own unit goes active *before* `uwsm finalize`
# exports anything — uwsm says as much in the log ("Autoready: Unit for
# hyprland.desktop is already active") — so the target activates, the condition
# is evaluated against an environment that has no WAYLAND_DISPLAY yet, and
# systemd records ConditionResult=no.
#
# A failed condition is not a failed unit: Result=success, nothing is logged at
# error level, and `systemctl --user status` shows a clean inactive unit. On a
# cold boot that meant no wallpaper, no idle handling and no polkit agent, with
# nothing anywhere saying why. waybar escaped it only by having no such
# condition; swaync escaped by being D-Bus activated a second later.
#
# wayland-session-waitenv.service is uwsm's own answer to this — a oneshot that
# blocks until UWSM_WAIT_VARNAMES appear. Ordering after it is the fix.
[Unit]
After=wayland-session-waitenv.service
PartOf=wayland-session@hyprland.desktop.target
After=wayland-session@hyprland.desktop.target
