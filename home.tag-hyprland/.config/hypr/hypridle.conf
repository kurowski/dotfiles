# Idle behaviour.
#
# Under Plasma this was powerdevil's job. hypridle is started by systemd
# (26-hyprland-session.sh binds it to wayland-session@Hyprland.target), so it
# runs in the Hyprland session only and powerdevil keeps the Plasma one.

general {
    # `pidof hyprlock ||` makes this idempotent: a second lock request while
    # already locked is a no-op rather than a second lock screen stacked on the
    # first, which is how you end up typing your password into nothing.
    lock_cmd       = pidof hyprlock || hyprlock

    # Lock *before* the machine suspends, not after it wakes. loginctl rather
    # than hyprlock directly so the session is properly marked locked and the
    # lock survives a race with the suspend itself.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# 2.5 min — dim the backlight. Cheap, reversible, and the warning shot that
# stops the next two listeners surprising you.
#
# `brightnessctl -s` saves the current level so `-r` can restore exactly what
# you had, rather than jumping to some fixed value.
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 5 min — lock. Long enough to read a page without the screen locking on you.
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min — screen off. Deliberately just after the lock, so the display never
# powers down while still showing your desktop.
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 30 min — suspend. Skipped while a window holds an idle inhibitor, which is
# what the `idle_inhibit = fullscreen` rule in rules.lua sets up for mpv.
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
