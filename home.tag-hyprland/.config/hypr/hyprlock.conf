# Lock screen.
#
# Still hyprlang — hyprlock hasn't moved to Lua the way the compositor has, so
# colours come from the generated flavour file rather than theme.lua.
source = ~/.local/state/theme-mode/hypr-colors.conf

general {
    hide_cursor      = true
    ignore_empty_input = true
    # Don't wait for the whole background to render before accepting a
    # password. On a lid-open you're usually typing before you're looking.
    immediate_render = true
}

background {
    monitor =
    path    = ~/.local/state/theme-mode/wallpaper.png

    # The same wallpaper as the desktop, blurred hard. Reads as "your session is
    # still there, behind this" rather than as a different screen.
    blur_passes  = 3
    blur_size    = 8
    noise        = 0.0117
    contrast     = 0.9
    brightness   = 0.75
    vibrancy     = 0.17
}

# Time. Large, light weight, sitting above centre.
label {
    monitor    =
    text       = cmd[update:1000] date +"%H:%M"
    color      = $text
    font_size  = 96
    font_family = JetBrainsMono Nerd Font ExtraLight
    position   = 0, 200
    halign     = center
    valign     = center
}

# Date, quieter, directly under the time.
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %e %B"
    color       = $subtext0
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    position    = 0, 110
    halign      = center
    valign      = center
}

# Battery and charge state — the one thing worth knowing without unlocking.
# BAT1, not BAT0: that's what the Framework 12 calls it. (There is also a
# hid-*-battery for the stylus; naming the path explicitly avoids reporting the
# pen's charge as the laptop's.)
label {
    monitor     =
    text        = cmd[update:30000] printf '%s%% %s' "$(cat /sys/class/power_supply/BAT1/capacity)" "$(cat /sys/class/power_supply/BAT1/status)"
    color       = $overlay1
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 0, -40
    halign      = center
    valign      = bottom
}

input-field {
    monitor        =
    size           = 300, 52
    outline_thickness = 2
    dots_size      = 0.26
    dots_spacing   = 0.3
    dots_center    = true

    outer_color    = $accent
    inner_color    = $surface0
    font_color     = $text
    check_color    = $accent
    fail_color     = $red

    fade_on_empty  = false
    # Empty on purpose. The field is centred under a clock on a blurred copy of
    # your own desktop; a "Password..." string adds nothing and is the one piece
    # of chrome that would date the design.
    placeholder_text =
    hide_input     = false
    rounding       = 12

    position       = 0, -60
    halign         = center
    valign         = center
}
