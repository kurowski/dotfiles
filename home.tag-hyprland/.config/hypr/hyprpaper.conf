# Wallpaper.
#
# hyprpaper 0.8 replaced the old `preload = …` / `wallpaper = mon,…` pair with
# `wallpaper { }` blocks. The old syntax doesn't error — the keys are simply
# unknown, so nothing is registered and the only symptom is one debug line,
# "Monitor eDP-1 has no target: no wp will be created", on a desktop that comes
# up with a plain grey background. Worth knowing before reaching for an older
# example config.
#
# One path, not two. The wallpaper is generated per flavour by
# 27-hyprland-wallpaper.sh, and theme-mode repoints this symlink and reloads —
# so this file never mentions latte or mocha.

splash = false

wallpaper {
    # Empty monitor = the fallback that applies to every output, so an external
    # display picks it up without being named.
    monitor =
    path    = ~/.local/state/theme-mode/wallpaper.png

    # cover crops to fill rather than letterboxing. The generated image is
    # 1920x1200, exactly the panel, so this only matters for external monitors.
    fit_mode = cover
}
