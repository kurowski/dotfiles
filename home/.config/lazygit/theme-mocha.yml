# Catppuccin Mocha, mauve accent. From catppuccin/lazygit
# themes-mergable/mocha/mauve. Selected at runtime via $LG_CONFIG_FILE — see
# the theme block in .zshrc. Any non-theme lazygit config wants its own file
# added to that comma-separated list (every file in it must exist; lazygit
# hard-errors on a missing one).
gui:
  theme:
    activeBorderColor:
      - '#cba6f7'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#cba6f7'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
  authorColors:
    '*': '#b4befe'
