# Arch names drift from Fedora's more than Ubuntu's do: `fd` not fd-find,
# `github-cli` not gh, `aws-cli-v2` not awscli2, `python-pip` not python3-pip,
# and docker is one package plus two plugins rather than five (containerd
# comes along as a dependency). nodejs is unpinned because Arch's is already
# current — the same reason 17-nvm.sh skips here.
#
# base-devel earns its place: paru rebuilds AUR packages from source on every
# upgrade, so the toolchain is a lasting part of the system, not just bootstrap
# scaffolding. pre-03-arch-repos.sh installs it earlier too, since the AUR
# helper has to exist before this phase runs.
#
# Missing next to the Fedora list — 1password, 1password-cli and VS Code — are
# AUR-only and live in scripts.tag-arch/00-aur-packages.sh instead. fprintd is
# missing for a different reason: cece has no fingerprint reader, and it's the
# only arch host.
