arch = [
  "firefox",
  "mpv",
  "rclone",
  "steam",
  "tailscale",
  "yt-dlp",
]
# Firefox on Ubuntu is installed in pre-02-ubuntu-repos.sh to handle
# apt pinning + the snap-shim downgrade.
ubuntu = [
  "tailscale",
]

[packages."tag:ubuntu".snap]
all = ["aws-cli/classic"]

[packages."tag:personal.tag:desktop.tag:ubuntu".snap]
all = ["gimp", "spotify"]

# Fedora has no snap; these come from Flathub instead. Scoped to
# personal so work Fedora desktops don't pick up Spotify.
[packages."tag:personal.tag:desktop.tag:fedora".flatpak]
all = ["com.spotify.Client", "org.gimp.GIMP"]

# Same on Arch, and for the same reason — no snap here either. Spotify is
# AUR-only and GIMP is in extra, but Flathub matches what the Fedora desktops
# already do and keeps one more proprietary build out of paru's hands.
[packages."tag:personal.tag:desktop.tag:arch".flatpak]
all = ["com.spotify.Client", "org.gimp.GIMP"]

# Source-only zsh plugins, vendored without a plugin manager and sourced
# from .zshrc. homie clones them on first apply, fast-forwards on later
# applies. Add `ref = "vX.Y.Z"` to freeze one on a long-lived host.
[externals."~/.zsh/plugins/zsh-autosuggestions"]
repo = "https://github.com/zsh-users/zsh-autosuggestions"

[externals."~/.zsh/plugins/fzf-tab"]
repo = "https://github.com/Aloxaf/fzf-tab"

[tags]
extra = []

[vars]
EDITOR = "nvim"
# Appearance fallback for hosts with no desktop to ask — servers, containers,
# anonymous devcontainers (work/light), macOS. Desktop hosts follow the
# desktop's own light/dark setting at runtime and only land here when there's
# no portal answering. Personal hosts override this to "dark".
THEME  = "light"
