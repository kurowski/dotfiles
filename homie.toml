[packages."tag:desktop"]
# wl-clipboard backs neovim's +/* registers on Wayland. Fedora's neovim
# rpm used to pull in a clipboard tool as a weak dep (xsel, the X11 one);
# dropping that package for the upstream build took the guarantee with it,
# so declare it. Desktop-scoped: over SSH neovim uses OSC 52 instead, and
# macOS has pbcopy built in.
fedora = ["btop", "claude-desktop-unofficial", "openssh-server", "wl-clipboard"]
ubuntu = [
  "btop",
  "code",
  "ddcutil",
  "deskflow",
  "docker.io",
  "docker-buildx",
  "fprintd",
  "ghostty",
  "libpam-fprintd",
  "ncurses-term",
  "openssh-server",
  "wl-clipboard",
]
# openssh is one package here (client + server), and it ships the unit
# disabled — 24-sshd.sh enables it. flatpak isn't part of a base Arch install
# the way it is on Fedora's KDE spin, and pre-03-arch-repos.sh needs it there
# to add the Flathub remote; it's declared here as the lasting statement of
# intent. Claude Desktop is AUR-only (00-aur-packages.sh).
arch = ["btop", "flatpak", "openssh", "wl-clipboard"]
macos = [
  "1password/cask",
  "btop",
  "deskflow/cask",
  "font-monaspace-nerd-font/cask",
  "ghostty/cask",
  "google-chrome/cask",
  "obsidian/cask",
]

[packages."tag:desktop.tag:fedora".flatpak]
