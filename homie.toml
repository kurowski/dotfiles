# Debian only shows up as devcontainers here (real hosts are Fedora). homie
# runs in the container via the personal VS Code dotfiles integration, so this
# list — not the project Dockerfile — is where my own CLI ergonomics belong.
# Kept identical to the ubuntu list (sibling distro; all in trixie's apt).
# The project Dockerfile still bakes the shared baseline (git, gh, zsh, build
# deps, infra binaries) so the image stands alone for CI and teammates.
debian = [
  "bat",
  "curl",
  "eza",
  "fastfetch",
  "fd-find",
  "fzf",
  "gcc",
  "gh",
  "git",
  "git-delta",
  "glow",
  "lazygit",
  "make",
  "python3-pip",
  "ripgrep",
  "tmux",
  "tokei",
  "zoxide",
  "zsh",
]
# Arch names drift from Fedora's more than Ubuntu's do: `fd` not fd-find,
# `github-cli` not gh, `aws-cli-v2` not awscli2, `python-pip` not python3-pip,
# and docker is one package plus two plugins rather than five (containerd
# comes along as a dependency). nodejs is unpinned because Arch's is already
# current — the same reason 13-nvm.sh skips here.
#
# base-devel earns its place: paru rebuilds AUR packages from source on every
# upgrade, so the toolchain is a lasting part of the system, not just bootstrap
# scaffolding. pre-03-arch-repos.sh installs it earlier too, since the AUR
# helper has to exist before this phase runs.
#
# Missing next to the Fedora list — 1password, 1password-cli and VS Code — are
# AUR-only and live in scripts.tag-arch/00-aur-packages.sh instead.
arch = [
  "aws-cli-v2",
  "base-devel",
  "bat",
  "curl",
  "ddcutil",
  "deskflow",
  "docker",
  "docker-buildx",
  "docker-compose",
  "eza",
  "fastfetch",
  "fd",
  "fzf",
  "gcc",
  "ghostty",
  "git",
  "git-delta",
  "github-cli",
  "glow",
  "lazygit",
  "make",
  "nodejs",
  "npm",
  "python-pip",
  "ripgrep",
  "tmux",
  "tokei",
  # Arch packages the Nerd-patched build, so 05-jetbrains-font.sh's upstream
  # download is redundant here and skips.
  "ttf-jetbrains-mono-nerd",
  "zoxide",
  "zsh",
]
macos = [
  "1password-cli/cask",
  "awscli",
  "bat",
  "eza",
  "fastfetch",
  "fd",
  "fzf",
  "gh",
  "git",
  "git-delta",
  "glow",
  "lazygit",
  "ripgrep",
  "shellcheck",
  "tmux",
  "tokei",
  "zoxide",
]
# Termux (Android) — its own repo, installed via `pkg`. CLI subset only;
# GUI/daemon tools (1password, docker, ghostty, fprintd, code, …) have no
# Android analog. Names follow Termux's repo, which differs from
# Debian/Fedora: fd (not fd-find), python (bundles pip), nodejs (not
# nodejs22), clang (Termux has no gcc). starship/neovim come from pkg here,
# so 15-starship.sh and 14-neovim-debian.sh no-op on Termux.
termux = [
  "atuin",
  "bat",
  "clang",
  "curl",
  "eza",
  "fastfetch",
  "fd",
  "fzf",
  "gh",
  "git",
  "glow",
  "lazygit",
  "make",
  "neovim",
  "nodejs",
  "openssh",
  "python",
  "ripgrep",
  "starship",
  "tmux",
  "tokei",
  "zoxide",
  "zsh",
]

[packages."tag:desktop"]
# wl-clipboard backs neovim's +/* registers on Wayland. Fedora's neovim
# rpm used to pull in a clipboard tool as a weak dep (xsel, the X11 one);
# dropping that package for the upstream build took the guarantee with it,
# so declare it. Desktop-scoped: over SSH neovim uses OSC 52 instead, and
# macOS has pbcopy built in.
fedora = ["btop", "claude-desktop-unofficial", "openssh-server", "wl-clipboard"]
ubuntu = [
  "btop",
  "code",
  "ddcutil",
  "deskflow",
  "docker.io",
  "docker-buildx",
  "fprintd",
  "ghostty",
  "libpam-fprintd",
  "ncurses-term",
  "openssh-server",
  "wl-clipboard",
]
# openssh is one package here (client + server), and it ships the unit
# disabled — 24-sshd.sh enables it. flatpak isn't part of a base Arch install
# the way it is on Fedora's KDE spin, and pre-03-arch-repos.sh needs it there
# to add the Flathub remote; it's declared here as the lasting statement of
# intent. Claude Desktop is AUR-only (00-aur-packages.sh).
arch = ["btop", "flatpak", "openssh", "wl-clipboard"]
macos = [
  "1password/cask",
  "btop",
  "deskflow/cask",
  "font-monaspace-nerd-font/cask",
  "ghostty/cask",
  "google-chrome/cask",
  "obsidian/cask",
]

[packages."tag:desktop.tag:fedora".flatpak]
all = ["md.obsidian.Obsidian"]

[packages."tag:desktop.tag:ubuntu".flatpak]
all = ["md.obsidian.Obsidian"]

[packages."tag:desktop.tag:arch".flatpak]
all = ["md.obsidian.Obsidian"]

[packages."tag:server"]
fedora = ["btop", "openssh-server"]
ubuntu = ["btop", "openssh-server"]

# Plasma itself, because Arch has no KDE spin to install it for us — the
# Fedora and Ubuntu KDE hosts get the desktop from their installer, so there's
# nothing to declare for them here. plasma-meta already depends on
# xdg-desktop-portal-kde, which is what theme-mode reads the light/dark setting
# from, and on noto-fonts somewhere in its closure.
#
# It does *not* pull a display manager: sddm is separate, and
# scripts.tag-arch.tag-kde/25-sddm.sh enables the unit. plasma-meta does bring
# plasma-login-manager along, but that claims neither the `display-manager`
# alias nor a conflict with sddm, so the two coexist and whichever unit is
# enabled wins.
[packages."tag:kde"]
arch = ["plasma-meta", "sddm"]

[packages."tag:gnome"]
ubuntu = [
  "gnome-browser-connector",
  "gnome-shell-extension-manager",
  "gnome-tweaks",
]

[packages."tag:personal"]
fedora = [
  "firefox",
  "mpv",
  "rclone",
  "seadrive-gui",
  "steam",
  "tailscale",
  "yt-dlp",
]
# steam is in multilib, which pre-03-arch-repos.sh enables — a stock
# pacman.conf leaves it commented out. seadrive-gui is AUR-only
# (00-aur-packages.sh). No ffmpeg entry: Arch ships the unrestricted build in
# extra, so there's nothing for 09-ffmpeg-swap.sh to swap.
arch = [
  "firefox",
  "mpv",
  "rclone",
  "steam",
  "tailscale",
  "yt-dlp",
]
# Firefox on Ubuntu is installed in pre-02-ubuntu-repos.sh to handle
# apt pinning + the snap-shim downgrade.
ubuntu = [
  "tailscale",
]

[packages."tag:ubuntu".snap]
all = ["aws-cli/classic"]

[packages."tag:personal.tag:desktop.tag:ubuntu".snap]
all = ["gimp", "spotify"]

# Fastmail and Ente Photos have no snap, so Ubuntu gets them from Flathub
# even though GIMP and Spotify come from snap just above.
[packages."tag:personal.tag:desktop.tag:ubuntu".flatpak]
all = ["com.fastmail.Fastmail", "io.ente.photos"]

# Fedora has no snap; these come from Flathub instead. Scoped to
# personal so work Fedora desktops don't pick up Spotify.
[packages."tag:personal.tag:desktop.tag:fedora".flatpak]
all = [
  "com.fastmail.Fastmail",
  "com.spotify.Client",
  "io.ente.photos",
  "org.gimp.GIMP",
]

# Same on Arch, and for the same reason — no snap here either. Spotify is
# AUR-only and GIMP is in extra, but Flathub matches what the Fedora desktops
# already do and keeps one more proprietary build out of paru's hands. Fastmail
# and Ente Photos are Flathub-only everywhere, so there's no choice to make.
[packages."tag:personal.tag:desktop.tag:arch".flatpak]
all = [
  "com.fastmail.Fastmail",
  "com.spotify.Client",
  "io.ente.photos",
  "org.gimp.GIMP",
]

# Source-only zsh plugins, vendored without a plugin manager and sourced
# from .zshrc. homie clones them on first apply, fast-forwards on later
# applies. Add `ref = "vX.Y.Z"` to freeze one on a long-lived host.
[externals."~/.zsh/plugins/zsh-autosuggestions"]
repo = "https://github.com/zsh-users/zsh-autosuggestions"

[externals."~/.zsh/plugins/fzf-tab"]
repo = "https://github.com/Aloxaf/fzf-tab"

[tags]
extra = []

[vars]
EDITOR = "nvim"
# Appearance fallback for hosts with no desktop to ask — servers, containers,
# anonymous devcontainers (work/light), macOS. Desktop hosts follow the
# desktop's own light/dark setting at runtime and only land here when there's
# no portal answering. Personal hosts override this to "dark". Termux renders
# dark regardless, via `hasTag "termux"` in theme-mode/config.tmpl — no
# per-host THEME needed there (its hostname is an unreliable "localhost", so
# we key off the distro tag instead).
THEME  = "light"
